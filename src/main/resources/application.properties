spring.application.name=aether-beauty
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/aether-beauty;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

aether.payment.gateway=demo
aether.payment.currency=INR
aether.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
aether.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
aether.payment.success-url=${PAYMENT_SUCCESS_URL:http://localhost:8080/collections.html#cart}
