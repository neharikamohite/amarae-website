spring.application.name=aether-beauty
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/aether-beauty;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

aether.payment.gateway=${AETHER_PAYMENT_GATEWAY:demo}
aether.payment.currency=INR
aether.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
aether.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
aether.payment.success-url=${PAYMENT_SUCCESS_URL:https://amaraeformulations.com/collections.html#cart}

# Shipping: flat fee below the free-shipping threshold, both in INR and
# both overridable via env vars without a redeploy.
aether.shipping.flat-fee=${AETHER_SHIPPING_FLAT_FEE:79}
aether.shipping.free-threshold=${AETHER_SHIPPING_FREE_THRESHOLD:1499}

# Review photo/video uploads. On Render's default (non-persistent-disk) web
# service plans this directory is wiped on every deploy/restart — see
# MediaStorageService for how to swap in S3/Cloudinary later.
aether.media.storage-dir=${AETHER_MEDIA_STORAGE_DIR:uploads/reviews}
aether.media.public-path=/media/reviews
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=120MB
