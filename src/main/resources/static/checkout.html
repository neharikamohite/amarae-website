<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Checkout | AMARAÈ Formulations</title>
    <meta name="description" content="Complete your AMARAÈ fragrance order securely." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="cursor-aura"></div>

    <header>
      <a class="logo" href="index.html" aria-label="AMARAÈ home"><img src="assets/Amaraè logo FL.png" alt="AMARAÈ" /></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="collections.html">Shop</a></li>
        <li><a href="findFragrance.html">Find Match</a></li>
        <li><a href="chemistry.html">Notes</a></li>
      </ul>
    </header>

    <main class="page-wrap">
      <h1 class="page-title">CHECKOUT</h1>
      <p class="page-sub">Complete your AMARAÈ payment securely</p>

      <section class="cart-panel">
        <div>
          <h2>Payment Gateway</h2>
          <p id="checkoutStatus">Preparing secure checkout...</p>
        </div>
        <button type="button" class="reveal-btn" id="payNowBtn">PAY NOW</button>
        <a class="secondary-btn compact" href="collections.html#cart">Return to cart</a>
        <p class="checkout-note" id="checkoutNote"></p>
      </section>
    </main>

    <footer class="site-footer site-footer-expanded"><div><strong>AMARAÈ Formulations</strong><span>Support: amaraeformulations@gmail.com · +91 95792 22532</span></div><div class="footer-links"><a href="privacy-policy.html">Privacy</a><a href="terms-and-conditions.html">Terms</a><a href="shipping-delivery.html">Shipping</a><a href="cancellation-refund.html">Returns</a></div><small>&copy; 2026 AMARAÈ Formulations.</small></footer>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="javas.js"></script>
    <script>
      window.addEventListener("load", async () => {
        const params = new URLSearchParams(window.location.search);
        const razorpayOrderId = params.get("orderId");
        const status = document.getElementById("checkoutStatus");
        const note = document.getElementById("checkoutNote");
        const button = document.getElementById("payNowBtn");

        if (!razorpayOrderId) {
          status.textContent = "No payment order was found.";
          button.disabled = true;
          return;
        }

        let config;
        try {
          const response = await fetch("/api/payments/config");
          config = await response.json();
        } catch (error) {
          status.textContent = "Payment config could not be loaded.";
          button.disabled = true;
          return;
        }

        if (config.gateway !== "razorpay") {
          status.textContent = "Live Razorpay checkout has not been configured yet. Return to your cart and contact support if you need help.";
          button.disabled = true;
          return;
        }

        status.textContent = "Your secure Razorpay payment is ready. If payment is cancelled or declined, your cart will remain available.";

        button.addEventListener("click", () => {
          if (!window.Razorpay || !config.keyId) {
            note.textContent = "Razorpay is not available or key id is missing.";
            return;
          }

          const checkout = new Razorpay({
            key: config.keyId,
            order_id: razorpayOrderId,
            name: "AMARAÈ Formulations",
            description: "AMARAÈ fragrance order payment",
            handler: async (response) => {
              const verify = await fetch("/api/payments/razorpay/verify", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  razorpayOrderId: response.razorpay_order_id,
                  razorpayPaymentId: response.razorpay_payment_id,
                  razorpaySignature: response.razorpay_signature,
                }),
              });

              if (verify.ok) {
                status.textContent = "Payment verified.";
                note.innerHTML = "Your order is confirmed. We’ll share dispatch updates by email. <a href='collections.html'>Continue shopping</a>.";
                button.disabled = true;
              } else {
                note.textContent = "We could not verify that payment. Your cart has been kept—please retry or contact amaraeformulations@gmail.com.";
              }
            },
            modal: {
              ondismiss: () => {
                note.textContent = "Payment was not completed. Your cart is still saved; you can retry whenever you are ready.";
              },
            },
            theme: { color: "#1a1a1a" },
          });
          checkout.open();
        });
      });
    </script>
  </body>
</html>
